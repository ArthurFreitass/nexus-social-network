<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/feed.css">
    <link rel="shortcut icon" href="../assets/img/logo-icon.png" type="image/x-icon">
    <title>Nexus | Feed</title>

</head>

<body>

    <header>

        <div class="img">
           <a href="../index.html"> 
               <img id="img" src="../assets/img/logo_comtexto-removebg-preview.png" alt=""> 
           </a> 
        </div>

        <div class="highlights">
            <a class="top" href="">Em Alta</a>
            <p id="separacao">|</p>
            <a class="top" href="">Seguidores</a>
        </div>

        <nav>

            <div id="navgation">
                <img src="../assets/img/hamburguer.png" alt="">
            </div>
            
            <ul id="menu">
                <li> <a class="list" href="../pages/about.html">Sobre</a> </li>
                <li> <a class="list" href="../pages/profile.html">Perfil</a> </li>
            </ul>
        </nav>

    </header>

    <aside class="sidebar">

        <h3 id="h3Sugestion">Sugestão de amizade</h3>

        <div class="profilesSugestion">
            <div id="profileSugestion">
                <img id="photoSugestion" src="../assets/img/Arthur.jpg" alt="">
            </div>
            <p class="textSugestion">ArthurFreitass</p>
        </div>

        <div class="profilesSugestion">
            <div id="profileSugestion">
                <img id="photoSugestion" src="../assets/img/Tiago.jpg" alt="">
            </div>
            <p class="textSugestion">ThiagoFrts</p>
        </div>

        <div class="profilesSugestion">
            <div id="profileSugestion">
                <img id="photoSugestion" src="../assets/img/Davi.jpg" alt="">
            </div>
            <p class="textSugestion">Davi-Profeta</p>
        </div>

    </aside>

    <main>

        <div class="card">

            <div class="photo-card">

                <div class="profile">

                    <div class="photoProfile">
                        <img id="photoProfile" src="../assets/img/logo_semtexto.png" alt="">
                    </div>

                    <div class="nameProfile">
                        <p> Nexus </p> 
                        <img id="verificar" src="../assets/img/Verificado.png" alt="">
                    </div>
                    
                </div>

                <div class="post">

                    <img class="photos" src="../assets/img/Design sem nome.png" alt="">
                    <button class="song"> 
                        <img class="imgSong" src="../assets/img/sem-som.png" alt=""> 
                    </button>
                    <audio class="playSong" src="../assets/audio/Dança do Canguru - Aline Barros & Cia 3 (Oficial)_DWGIkpyl9Rg.mp3"></audio>

                </div>

                <div class="likes">

                    <div class="icons">
                        <img class="like" src="../assets/img/coracao-sem-like.png" alt="">
                    </div>

                    <div class="contador">
                        <p class="likeCounter">0</p>
                    </div>

                    <div class="icons">
                        <img class="commentsClick" src="../assets/img/cometarios.png" alt="">
                    </div>

                    <div class="contador">
                        <p class="commentsCounter">0</p>
                    </div>

                    <div class="icons" id="save">
                        <img src="../assets/img/salvar-post.png" alt="">
                    </div>
                    
                </div>

            </div>

        </div>

    </main>
    <script src="../assets/js/feed.js"></script>
</body>
</html>
