<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta Nexus para acessar seu feed, publicações e conexões.">
    <title>Nexus | Entrar</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <div class="login-page">


        <aside class="brand-panel">
            <div class="brand-content">
                <img src="/img/Logo-tema-escuro.png" alt="" width="200px">
                <h1>Conecte-se à sua rede.</h1>
                <p>Compartilhe ideias, publique momentos e construa conexões reais dentro da Nexus.</p>
            </div>
        </aside>

        <main id="conteudo-principal" class="form-panel">
            <div class="form-wrapper">

                <div class="form-header">
                    <h2>Entrar</h2>
                    <p class="subtitle">Bem-vindo de volta Nexus! Insira seus dados para continuar.</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>

                    <div class="form-group">
                        <label for="email">E-mail ou usuário</label>
                        <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="senha" name="senha" placeholder="Senha" required>
                        </div>
                        <span class="error-message" id="senhaError"></span>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="lembrar" name="lembrar">
                            Lembrar de mim
                        </label>
                        <a href="#" class="forgot-password">Esqueci minha senha</a>
                    </div>

                    <button type="submit" class="btn-login">Entrar</button>

                </form>

                <p class="form-footer">
                    Novo na Nexus?
                    <a href="cadastro.html">Crie sua conta</a>
                </p>

            </div>
        </main>

    </div>



</body>

</html>
