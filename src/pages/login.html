<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Login</title>
    <link rel="stylesheet" href="login.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <main class="login-container">

        <section class="login-box">

            <div class="login-logo">
                <img src="/assets/img/Logo-tema-escuro.png" alt="Logo Nexus" width="200px">
            </div>

            <h1 class="login-title">Bem-vindo a Nexs</h1>
            <p class="login-subtitle">Entre com sua conta para continuar</p>

            <form id="loginForm" class="login-form" novalidate>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                            👁
                        </button>
                    </div>
                    <span class="error-message" id="senhaError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="lembrar" name="lembrar">
                        Lembrar de mim
                    </label>
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>

            </form>

            <p class="login-footer">
                Ainda não tem conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>



</body>
</html>
